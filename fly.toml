# fly.toml app configuration file generated for n8n-fly-m4cmja on 2026-11-15T17:43:44Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'n8n-fly-m4cmja'
primary_region = 'ams'

[build]
[http_service]
  internal_port = 5678
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

  [[mounts]]
  source = 'n8n_data'
  destination = '/home/node/.n8n'
